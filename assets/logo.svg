<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="reproGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f0c36" />
    </linearGradient>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="10" y="10" width="380" height="380" rx="36" fill="url(#reproGrad)" stroke="#4338ca" stroke-width="3"/>
  <rect x="25" y="25" width="350" height="350" rx="26" fill="none" stroke="#3730a3" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Science Flask / Test Tube Contour -->
  <path d="M175,100 L225,100 L225,145 L285,260 C295,280 280,305 255,305 L145,305 C120,305 105,280 115,260 L175,145 Z" 
        fill="#1e1b4b" stroke="url(#flaskGrad)" stroke-width="6" filter="url(#glow)"/>

  <!-- Bubbling Chemical Bug Liquid -->
  <path d="M135,260 L175,190 L225,190 L265,260 C272,275 262,295 245,295 L155,295 C138,295 128,275 135,260 Z" 
        fill="url(#liquidGrad)"/>

  <!-- Bubble Particles -->
  <circle cx="175" cy="225" r="8" fill="#ffffff" opacity="0.8"/>
  <circle cx="215" cy="245" r="11" fill="#ffffff" opacity="0.7"/>
  <circle cx="195" cy="265" r="6" fill="#ffffff" opacity="0.9"/>
  <circle cx="190" cy="165" r="7" fill="#818cf8" filter="url(#glow)"/>
  <circle cx="210" cy="130" r="5" fill="#c084fc"/>

  <!-- Top Badge Label -->
  <rect x="135" y="38" width="130" height="24" rx="12" fill="#4f46e5"/>
  <text x="200" y="54" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5" text-anchor="middle">REPRO-GEN</text>
</svg>
